[project]
name = "codeguard-agent"
version = "1.0.0"
description = "AI-powered automated code review & refactoring agent with multi-agent collaboration"
authors = [{name = "Ryan", email = "ryan@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "gitpython>=3.1.0",
    "astor>=0.8.0",
    "pathspec>=0.11.0",
]

[project.scripts]
codeguard = "codeguard.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
